name: rescue-release

# D58: a release carries its own Rescue USB image. Run by hand with the
# release's tag, after the tested image is on "rescue-edge": it copies the
# image, its checksum and version into that release, checking the image
# against its checksum AND against the checksum the tag's code pins
# (src/omabackups/setup/rescue_pin.py). Nothing goes through anyone's own
# connection.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, e.g. v2.0.1"
        required: true

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      # Actions are pinned to exact commits (plugin store rule).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Copy the tested image into the release
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          pin="$(sed -n 's/^SHA256 = "\([0-9a-f]\{64\}\)"$/\1/p' src/omabackups/setup/rescue_pin.py)"
          release="$(sed -n 's/^RELEASE = "\(.*\)"$/\1/p' src/omabackups/setup/rescue_pin.py)"
          [[ -n "$pin" && "$release" == "$TAG" ]] || { echo "rescue_pin.py at $TAG doesn't pin $TAG"; exit 1; }
          mkdir out && cd out
          gh release download rescue-edge -p 'omabackups-rescue-x86_64.*'
          sha256sum -c omabackups-rescue-x86_64.iso.sha256
          echo "$pin  omabackups-rescue-x86_64.iso" | sha256sum -c
          gh release upload "$TAG" omabackups-rescue-x86_64.iso omabackups-rescue-x86_64.iso.sha256 \
            omabackups-rescue-x86_64.version --clobber
