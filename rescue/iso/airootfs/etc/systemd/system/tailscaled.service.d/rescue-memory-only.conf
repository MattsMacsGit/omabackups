# The Rescue USB joins your Tailscale network only for the rescue: state in
# memory only makes it an ephemeral device, so Tailscale drops it from your
# devices by itself once the stick is switched off (as 1.x did). With saved
# state, every rescue left an entry behind in the Tailscale app.
[Service]
ExecStart=
ExecStart=/usr/bin/tailscaled --state=mem: --statedir=/run/tailscale --socket=/run/tailscale/tailscaled.sock --port=${PORT} $FLAGS
